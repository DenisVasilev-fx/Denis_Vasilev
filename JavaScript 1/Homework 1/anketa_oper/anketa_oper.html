<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>

<body>

    <script>
        var surname = prompt('Введите фамилию:');
        var firstName = prompt('Введите имя:');
        var patronymic = prompt('Введите отчество:');
        var age = prompt('Введите возраст, лет:');
        var gender = confirm('Ваш пол мужской?');

        age < 60?
            gender == true?
                alert('Ваше ФИО: ' + surname + ' ' + firstName + ' ' + patronymic +
                    '\nВаш возраст в годах: ' + Number(age) +
                    '\nВаш возраст в днях: ' + (Number(age) * 365) +
                    '\nЧерез 5 лет вам будет: ' + (Number(age) + 5) +
                    '\nВаш пол: мужской' +
                    '\nВы на пенсии: нет')
            :
                alert('Ваше ФИО: ' + surname + ' ' + firstName + ' ' + patronymic +
                    '\nВаш возраст в годах: ' + Number(age) +
                    '\nВаш возраст в днях: ' + (Number(age) * 365) +
                    '\nЧерез 5 лет вам будет: ' + (Number(age) + 5) +
                    '\nВаш пол: женский' +
                    '\nВы на пенсии: нет')
        :
            gender == true?
                alert('Ваше ФИО: ' + surname + ' ' + firstName + ' ' + patronymic +
                    '\nВаш возраст в годах: ' + Number(age) +
                    '\nВаш возраст в днях: ' + (Number(age) * 365) +
                    '\nЧерез 5 лет вам будет: ' + (Number(age) + 5) +
                    '\nВаш пол: мужской' +
                    '\nВы на пенсии: да')
            :
                alert('Ваше ФИО: ' + surname + ' ' + firstName + ' ' + patronymic +
                    '\nВаш возраст в годах: ' + Number(age) +
                    '\nВаш возраст в днях: ' + (Number(age) * 365) +
                    '\nЧерез 5 лет вам будет: ' + (Number(age) + 5) +
                    '\nВаш пол: женский' +
                    '\nВы на пенсии: да')
    </script>

</body>

</html>
