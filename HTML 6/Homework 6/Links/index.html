<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <style>
        div {
            font-size: 0px;
            margin: 20px 0px;

        }

        a {
            color: green;
        }

        div a {
            border-right: 3px solid red;
            padding: 10px 20px;
            font-size: 30px;
        }

        div a:last-child {
            border-right: none;
        }

        a:hover {
            color: red;
        }

        ul {
            padding-left: 0px;
        }

        .menu_1 {
            text-align: center;
        }

        /* menu_1: Псевдоэлементы позволяют сократить часть контента за счет частого повторения.*/
        .menu_1 a::after {
            content: ' ссылка';
        }

        /*menu_2: Float позволяет разместить блок контента справа или слева, при этом отступы 
        будут производиться от левого либо от правого края контейнера. Контент,
        который идет за зафлоченным блоком начинает обтекать его. Чтобы этого избежать 
        необходимо дополнительная распорка (clear: both).*/
        .menu_2 {
            float: right;
    
        }

        .menu_2-1{
            clear: both;
        }

        /*menu_3: Ссылки в виде элемента списка, чтобы список сделать строчным необходимо применить display: inline.*/

        .menu_3 ul {
            margin-top: 40px;
        }

        .menu_3 ul li {
            display: inline;
            border-right: 3px solid red;
            padding: 10px 0px;
            font-size: 30px;
        }

        .menu_3 ul li:last-child {
            border-right: none;
        }
        
    </style>

    <title>Document</title>
</head>

<body>
    <div class="menu_1">
        <a href="#">первая</a>
        <a href="#">вторая</a>
        <a href="#">третья</a>
        <a href="#">четвертая</a>
        <a href="#">пятая</a>
    </div>
    <div class="menu_2">
        <a href="#">первая ссылка</a>
        <a href="#">вторая ссылка</a>
        <a href="#">третья ссылка</a>
        <a href="#">четвертая ссылка</a>
        <a href="#">пятая ссылка</a>
    </div>
    <div class="menu_2-1"></div>
    <div class="menu_3">
        <ul>
           <li><a href="#">первая ссылка</a></li>
           <li><a href="#">вторая ссылка</a></li>
           <li><a href="#">третья ссылка</a></li>
           <li><a href="#">четвертая ссылка</a></li>
           <li><a href="#">пятая ссылка</a></li> 
        </ul>   
    </div>

</body>

</html>
